<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sacred Agni Fire Gradients -->
    <linearGradient id="fireOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="25%" stop-color="#FFB300"/>
      <stop offset="60%" stop-color="#FF5722"/>
      <stop offset="90%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </linearGradient>
    <linearGradient id="fireCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFF9C4"/>
      <stop offset="70%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>

    <!-- Brass Havan Kund Metal Gradients -->
    <linearGradient id="kundBrass" x1="10" y1="40" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="60%" stop-color="#FFB300"/>
      <stop offset="85%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#8D5B00"/>
    </linearGradient>

    <!-- Red Rose Petal Gradient -->
    <linearGradient id="roseRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="50%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </linearGradient>

    <!-- Mangal Kalash Copper / Gold -->
    <linearGradient id="kalashGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="60%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <!-- Sacred Wedding Halo Glow -->
    <filter id="weddingGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Auspicious Crimson & Gold Ambient Halo -->
  <circle cx="40" cy="40" r="32" fill="#E91E63" opacity="0.16" filter="url(#weddingGlow)"/>

  <!-- Tiered Vedic Brass Havan Kund (Holy Altar) -->
  <!-- Bottom Tier Base Platform -->
  <polygon points="12,68 68,68 64,74 16,74" fill="#6A1B9A" opacity="0.6"/>
  <polygon points="14,64 66,64 62,69 18,69" fill="#8D5B00"/>
  <polygon points="16,64 64,64 61,68 19,68" fill="url(#kundBrass)"/>

  <!-- Middle Tier Altar Step -->
  <polygon points="19,57 61,57 57,64 23,64" fill="#B26A00"/>
  <polygon points="21,57 59,57 56,63 24,63" fill="url(#kundBrass)"/>

  <!-- Top Tier Kund Rim -->
  <polygon points="25,50 55,50 53,57 27,57" fill="#8D5B00"/>
  <polygon points="27,50 53,50 51,56 29,56" fill="url(#kundBrass)"/>

  <!-- Kund Inner Basin (Depression) -->
  <polygon points="30,52 50,52 48,55 32,55" fill="#3E2723"/>

  <!-- Sacred Agni Flames (Holy Vedic Wedding Fire) -->
  <!-- Outer Rising Flame Tongues -->
  <path d="M28 50 C23 38 28 26 34 20 C34 25 36 29 33 33 C38 26 42 12 37 8 C44 14 47 24 43 32 C47 26 49 18 47 14 C54 21 56 34 47 50 Z" fill="url(#fireOuter)"/>
  
  <!-- Center Sacred Bright Flame Core -->
  <path d="M34 50 C31 40 34 30 38 22 C39 27 40 31 38 34 C42 27 45 20 41 15 C47 22 47 31 43 38 C45 33 46 29 45 25 C49 32 49 42 43 50 Z" fill="url(#fireCore)"/>

  <!-- White-Hot Sacred Flame Center -->
  <ellipse cx="40" cy="44" rx="4.5" ry="6.5" fill="#FFFFFF"/>
  <ellipse cx="40" cy="45" rx="2.5" ry="4" fill="#FFFDE7"/>

  <!-- Auspicious Mangal Kalash with Coconut (Shriphal) on Right Side -->
  <g transform="translate(48, 44) scale(0.65)">
    <!-- Kalash Pot Body -->
    <ellipse cx="14" cy="18" rx="8" ry="7" fill="url(#kalashGold)"/>
    <ellipse cx="14" cy="12" rx="5" ry="2" fill="#FFE082"/>
    <rect x="10" y="11" width="8" height="2" fill="#D32F2F"/>
    <!-- Mango Leaves (Amra Pallav) -->
    <path d="M10 11 C6 5 4 2 2 4 C4 8 8 10 10 11 Z" fill="#4CAF50"/>
    <path d="M18 11 C22 5 24 2 26 4 C24 8 20 10 18 11 Z" fill="#4CAF50"/>
    <path d="M14 11 C14 3 14 0 14 0 C14 0 14 3 14 11 Z" fill="#81C784"/>
    <!-- Sacred Coconut (Shriphal with sacred thread) -->
    <ellipse cx="14" cy="6" rx="4" ry="5" fill="#795548"/>
    <path d="M11 6 Q14 3 17 6" stroke="#D32F2F" stroke-width="1"/>
    <!-- Red Swastik Mark on Kalash -->
    <circle cx="14" cy="18" r="1.5" fill="#D32F2F"/>
  </g>

  <!-- Royal Varmala (Twin Wedding Garlands) draped in front of Kund -->
  <g transform="translate(0, 0)">
    <!-- Garland Curved Strand (Red Roses & Jasmine) -->
    <!-- Left Garland Swag -->
    <circle cx="20" cy="64" r="3.5" fill="url(#roseRed)"/>
    <circle cx="25" cy="66" r="2.2" fill="#FFFFFF"/>
    <circle cx="29" cy="67.5" r="3.2" fill="url(#roseRed)"/>
    <circle cx="34" cy="69" r="2.2" fill="#FFFFFF"/>
    
    <!-- Center Intertwined Nuptial Varmala Knot -->
    <circle cx="40" cy="70" r="3.8" fill="url(#roseRed)"/>
    <circle cx="40" cy="70" r="1.5" fill="#FFF59D"/>
    
    <!-- Right Garland Swag -->
    <circle cx="46" cy="69" r="2.2" fill="#FFFFFF"/>
    <circle cx="51" cy="67.5" r="3.2" fill="url(#roseRed)"/>
    <circle cx="55" cy="66" r="2.2" fill="#FFFFFF"/>
    <circle cx="60" cy="64" r="3.5" fill="url(#roseRed)"/>
  </g>

  <!-- Auspicious Gold Dots / Coins on Altar -->
  <circle cx="40" cy="60" r="1.6" fill="#FFF59D"/>
  <circle cx="33" cy="60" r="1.2" fill="#FFF59D"/>
  <circle cx="47" cy="60" r="1.2" fill="#FFF59D"/>

  <!-- Holy Wedding Sparkles -->
  <path d="M18 20 L19.5 16 L21 20 L25 21.5 L21 23 L19.5 27 L18 23 L14 21.5 Z" fill="#FFF9C4" opacity="0.9"/>
  <path d="M62 16 L63.5 12 L65 16 L69 17.5 L65 19 L63.5 23 L62 19 L58 17.5 Z" fill="#FFF9C4" opacity="0.9"/>
</svg>
