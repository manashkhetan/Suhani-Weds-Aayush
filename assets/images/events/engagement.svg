<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ringGold" x1="15" y1="25" x2="65" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="40%" stop-color="#FFD54F"/>
      <stop offset="75%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <linearGradient id="diamondGrad" x1="30" y1="12" x2="50" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E1F5FE"/>
      <stop offset="80%" stop-color="#81D4FA"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="sapphireGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Sapphire Aura -->
  <circle cx="40" cy="40" r="32" fill="#00E5FF" opacity="0.12" filter="url(#ringGlow)"/>

  <!-- Male Band (Interlocking in background) -->
  <ellipse cx="48" cy="50" rx="16" ry="16" stroke="#FFA000" stroke-width="5" opacity="0.4"/>
  <ellipse cx="48" cy="50" rx="16" ry="16" stroke="url(#ringGold)" stroke-width="4.5"/>

  <!-- Main Engagement Ring Band -->
  <ellipse cx="36" cy="48" rx="18" ry="18" stroke="#FF8F00" stroke-width="6"/>
  <ellipse cx="36" cy="48" rx="18" ry="18" stroke="url(#ringGold)" stroke-width="5"/>
  <ellipse cx="36" cy="48" rx="14" ry="14" fill="#3D1122" opacity="0.85"/>

  <!-- Diamond Crown Mount (Prongs) -->
  <path d="M30 26 L36 32 L42 26 L46 22 L26 22 Z" fill="#FFB300"/>

  <!-- Brilliant Cut Solitaire Diamond -->
  <path d="M30 22 L36 12 L42 22 L36 29 Z" fill="url(#diamondGrad)"/>
  <path d="M24 22 L30 22 L36 29 L26 22 Z" fill="#81D4FA" opacity="0.9"/>
  <path d="M48 22 L42 22 L36 29 L46 22 Z" fill="#0288D1" opacity="0.9"/>
  <path d="M30 22 L36 12 L28 22 Z" fill="#E1F5FE"/>
  <path d="M42 22 L36 12 L44 22 Z" fill="#B3E5FC"/>
  
  <!-- Diamond Facet Highlights -->
  <polygon points="36,12 33,22 36,25 39,22" fill="#FFFFFF"/>
  <circle cx="36" cy="18" r="1.5" fill="#FFFFFF"/>

  <!-- Diamond Shimmering Rays -->
  <path d="M36 4 L37.5 10 L36 12 L34.5 10 Z" fill="#FFFFFF"/>
  <path d="M22 14 L28 17 L26 19 L22 16 Z" fill="#E1F5FE"/>
  <path d="M50 14 L46 19 L44 17 L50 16 Z" fill="#E1F5FE"/>
  
  <!-- Sparkles -->
  <path d="M16 34 L17.5 30 L19 34 L23 35.5 L19 37 L17.5 41 L16 37 L12 35.5 Z" fill="#E1F5FE" opacity="0.9"/>
  <path d="M60 30 L61 27 L62 30 L65 31 L62 32 L61 35 L60 32 L57 31 Z" fill="#FFF59D" opacity="0.9"/>
</svg>
