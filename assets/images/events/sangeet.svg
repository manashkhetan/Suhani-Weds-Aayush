<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="dholBody" x1="16" y1="28" x2="64" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C2185B"/>
      <stop offset="35%" stop-color="#880E4F"/>
      <stop offset="70%" stop-color="#4A148C"/>
      <stop offset="100%" stop-color="#311B92"/>
    </linearGradient>
    <linearGradient id="dholGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="45%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <filter id="sangeetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Violet Glow -->
  <circle cx="40" cy="40" r="32" fill="#BA68C8" opacity="0.15" filter="url(#sangeetGlow)"/>

  <!-- Dholak Barrel (Slightly Angled) -->
  <g transform="rotate(-15, 40, 44)">
    <!-- Main Shell -->
    <path d="M18 32 C30 26 50 26 62 32 L62 56 C50 62 30 62 18 56 Z" fill="url(#dholBody)"/>
    <ellipse cx="40" cy="44" rx="22" ry="16" fill="url(#dholBody)" opacity="0.9"/>

    <!-- Left Drum Head -->
    <ellipse cx="18" cy="44" rx="4.5" ry="12" fill="#FFE082" stroke="url(#dholGold)" stroke-width="2"/>
    <ellipse cx="18" cy="44" rx="2" ry="6" fill="#5D4037"/>

    <!-- Right Drum Head -->
    <ellipse cx="62" cy="44" rx="4.5" ry="12" fill="#FFE082" stroke="url(#dholGold)" stroke-width="2"/>
    <ellipse cx="62" cy="44" rx="2.5" ry="7" fill="#3E2723"/>

    <!-- Gold Accent Bands -->
    <path d="M22 33 C22 33 22 55 22 55" stroke="url(#dholGold)" stroke-width="2"/>
    <path d="M58 33 C58 33 58 55 58 55" stroke="url(#dholGold)" stroke-width="2"/>
    
    <!-- Tuning Ropes (Diamond Cross Hatching) -->
    <path d="M22 34 L31 56 L40 32 L49 56 L58 34" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M22 54 L31 32 L40 56 L49 32 L58 54" stroke="#FFD54F" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Center Ring Rings -->
    <circle cx="31" cy="44" r="2" fill="#FFF59D"/>
    <circle cx="40" cy="44" r="2" fill="#FFF59D"/>
    <circle cx="49" cy="44" r="2" fill="#FFF59D"/>
  </g>

  <!-- Musical Rhythm Swirls & Notes -->
  <path d="M54 16 C57 14 62 16 63 20" stroke="url(#dholGold)" stroke-width="2" stroke-linecap="round"/>
  <!-- Eighth Note 1 -->
  <g transform="translate(48, 12) scale(0.7)">
    <ellipse cx="16" cy="18" rx="3.5" ry="2.5" fill="#FF80AB" transform="rotate(-20, 16, 18)"/>
    <rect x="18" y="6" width="2" height="12" fill="#FF80AB"/>
    <path d="M20 6 C24 6 26 10 26 10" stroke="#FF80AB" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Eighth Note 2 (Top Left) -->
  <g transform="translate(14, 16) scale(0.65)">
    <ellipse cx="16" cy="18" rx="3.5" ry="2.5" fill="#EA80FC" transform="rotate(-20, 16, 18)"/>
    <rect x="18" y="6" width="2" height="12" fill="#EA80FC"/>
    <path d="M20 6 C24 6 26 10 26 10" stroke="#EA80FC" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Ghungroo / Sparkles -->
  <circle cx="20" cy="62" r="2.5" fill="#FFE082"/>
  <circle cx="26" cy="65" r="2.5" fill="#FFE082"/>
  <circle cx="32" cy="67" r="2.5" fill="#FFE082"/>
  
  <path d="M64 28 L65.5 24 L67 28 L71 29.5 L67 31 L65.5 35 L64 31 L60 29.5 Z" fill="#FFF59D" opacity="0.9"/>
</svg>
