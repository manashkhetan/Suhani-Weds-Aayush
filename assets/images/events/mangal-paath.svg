<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sacred Pink & Gold Silk Gradient -->
    <linearGradient id="poshaakSilk" x1="10" y1="15" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="40%" stop-color="#E91E63"/>
      <stop offset="80%" stop-color="#C2185B"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </linearGradient>

    <!-- Temple Gold Gradient -->
    <linearGradient id="templeGold" x1="15" y1="10" x2="65" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="70%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <!-- Silver Sinhasan Gradient -->
    <linearGradient id="silverSinhasan" x1="20" y1="20" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#ECEFF1"/>
      <stop offset="75%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>

    <!-- Sacred Diya Flame Gradient -->
    <linearGradient id="paathFlame" x1="40" y1="52" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="30%" stop-color="#FFEB3B"/>
      <stop offset="70%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#D50000"/>
    </linearGradient>

    <radialGradient id="divineAura" cx="40" cy="40" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#E91E63" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E91E63" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Divine Glow -->
  <circle cx="40" cy="40" r="36" fill="url(#divineAura)"/>

  <!-- Ornate Arch / Singhasan Canopy -->
  <path d="M16 38 C16 22, 26 12, 40 12 C54 12, 64 22, 64 38" stroke="url(#templeGold)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M22 36 C22 25, 30 18, 40 18 C50 18, 58 25, 58 36" stroke="url(#silverSinhasan)" stroke-width="1.2" stroke-dasharray="2 3" fill="none"/>
  
  <!-- Crown Finial / Kalash Motif at Top -->
  <circle cx="40" cy="10" r="3" fill="url(#templeGold)"/>
  <path d="M38 7 L40 3 L42 7 Z" fill="url(#templeGold)"/>

  <!-- Royal Poshaak / Chunri Drapes -->
  <path d="M18 36 C22 45, 26 56, 24 64 C28 62, 34 60, 40 60 C46 60, 52 62, 56 64 C54 56, 58 45, 62 36 C54 40, 48 34, 40 34 C32 34, 26 40, 18 36 Z" fill="url(#poshaakSilk)" opacity="0.95"/>
  <path d="M18 36 C26 40, 32 34, 40 34 C48 34, 54 40, 62 36" stroke="url(#templeGold)" stroke-width="1.5" fill="none"/>
  <path d="M24 64 C28 62, 34 60, 40 60 C46 60, 52 62, 56 64" stroke="url(#templeGold)" stroke-width="1.5" fill="none"/>

  <!-- Sacred Charan Paduka / Trishul Emblem -->
  <!-- Left Paduka -->
  <ellipse cx="36" cy="48" rx="3.5" ry="6" fill="url(#silverSinhasan)" stroke="url(#templeGold)" stroke-width="0.8"/>
  <circle cx="36" cy="45" r="1.2" fill="#D50000"/>
  
  <!-- Right Paduka -->
  <ellipse cx="44" cy="48" rx="3.5" ry="6" fill="url(#silverSinhasan)" stroke="url(#templeGold)" stroke-width="0.8"/>
  <circle cx="44" cy="45" r="1.2" fill="#D50000"/>

  <!-- Auspicious Diya Lamp at Base -->
  <path d="M30 68 C30 63, 50 63, 50 68 C50 71, 30 71, 30 68 Z" fill="url(#templeGold)"/>
  <ellipse cx="40" cy="67" rx="10" ry="2.5" fill="#FFE082"/>
  
  <!-- Diya Flame -->
  <path d="M40 66 C37 63, 37 57, 40 52 C43 57, 43 63, 40 66 Z" fill="url(#paathFlame)"/>
  <circle cx="40" cy="60" r="2" fill="#FFFFFF" opacity="0.8"/>

  <!-- Marigold Garlands Flanking -->
  <circle cx="20" cy="38" r="2.2" fill="#FF9800"/>
  <circle cx="21" cy="44" r="2.2" fill="#FFD54F"/>
  <circle cx="22" cy="50" r="2.2" fill="#FF9800"/>
  <circle cx="60" cy="38" r="2.2" fill="#FF9800"/>
  <circle cx="59" cy="44" r="2.2" fill="#FFD54F"/>
  <circle cx="58" cy="50" r="2.2" fill="#FF9800"/>
</svg>
